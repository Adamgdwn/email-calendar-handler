<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="0.5" stop-color="#7C4DE8"/>
      <stop offset="1" stop-color="#8E3BE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FE9FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8FE9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="256" rx="116" fill="#FFFFFF" opacity="0.06"/>

  <!-- neural constellation (the "intelligence") -->
  <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="172" y1="196" x2="256" y2="158"/>
    <line x1="256" y1="158" x2="340" y2="196"/>
    <line x1="172" y1="196" x2="256" y2="246"/>
    <line x1="340" y1="196" x2="256" y2="246"/>
    <line x1="256" y1="158" x2="256" y2="246"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="172" cy="196" r="15"/>
    <circle cx="340" cy="196" r="15"/>
    <circle cx="256" cy="158" r="17"/>
  </g>

  <!-- the smart node beaming a message into the inbox -->
  <circle cx="256" cy="246" r="52" fill="url(#glow)"/>
  <line x1="256" y1="246" x2="256" y2="312" stroke="#8FE9FF" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="246" r="20" fill="#8FE9FF"/>

  <!-- inbox tray with a central slot -->
  <path d="M132 308 L196 308 L218 340 L294 340 L316 308 L380 308 L380 380 Q380 404 356 404 L156 404 Q132 404 132 380 Z"
        fill="none" stroke="#FFFFFF" stroke-width="23" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
